<!-- 时钟 -->
<div id="my-clock" style="text-align: center; font-size: 0.9em; font-weight: bold; margin-top: 20px; margin-bottom: 20px; opacity: 0.8;"></div>

<script>
    // ========== 1. 实时时钟 ==========
    setInterval(function() {
        document.getElementById('my-clock').innerText = new Date().toLocaleString('zh-CN', { hour12: false });
    }, 1000);
    document.getElementById('my-clock').innerText = new Date().toLocaleString('zh-CN', { hour12: false });

    // ========== 2. 等页面加载完毕，再执行插入 ==========
    document.addEventListener("DOMContentLoaded", function() {
        
        // 注入评论区（延迟 1 秒，确保页面已经渲染完成）
        setTimeout(function() {
            try {
                var footer = document.querySelector('footer');
                
                // 强制判断：只有网址里包含 /posts/ 才加载评论区，首页绝对不加载
                if (window.location.pathname.includes('/posts/') && footer && !document.getElementById('my-custom-giscus')) {
                    var giscusDiv = document.createElement('div');
                    giscusDiv.id = 'my-custom-giscus';
                    // 强制设置宽度和毛玻璃样式
                    giscusDiv.style.cssText = "margin: 40px auto !important; width: 100% !important; max-width: 700px !important; padding: 20px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.1);";
                    
                    // 插入到 footer 之前
                    footer.parentNode.insertBefore(giscusDiv, footer);

                    var script = document.createElement('script');
                    script.src = "https://giscus.app/client.js";
                    script.setAttribute("data-repo", "whymoonbrid/whymoonbrid.github.io");
                    script.setAttribute("data-repo-id", "R_kgDOVTyFwQ");
                    script.setAttribute("data-category", "General");
                    script.setAttribute("data-category-id", "DIC_kwDOVTyFwC4DJW4H");
                    script.setAttribute("data-mapping", "pathname");
                    script.setAttribute("data-strict", "0");
                    script.setAttribute("data-reactions-enabled", "1");
                    script.setAttribute("data-emit-metadata", "0");
                    script.setAttribute("data-input-position", "bottom");
                    script.setAttribute("data-theme", "preferred_color_scheme");
                    script.setAttribute("data-lang", "zh-CN");
                    script.setAttribute("crossorigin", "anonymous");
                    script.async = true;
                    
                    giscusDiv.appendChild(script);
                }
            } catch (e) { console.log("评论区加载失败"); }
        }, 1000);
    });
</script>

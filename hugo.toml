# ========================================== #
# Giscus 评论配置
# ========================================== #
[params.giscus]
    repo = "whymoonbrid/whymoonbrid.github.io"
    repoId = "R_kgDOVTyFwQ"
    category = "General"                          # ⚠️ 注意：统一改为了 General
    categoryId = "DIC_kwDOVTyFwC4DJW4H"           # ⚠️ 注意：统一为了 ...4H
    mapping = "pathname"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "preferred_color_scheme"
    lang = "zh-CN"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
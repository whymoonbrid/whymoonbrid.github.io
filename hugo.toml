baseURL = "https://whymoonbrid.github.io/"
title = "my life"
theme = "PaperMod"

locale = "zh-cn"
defaultContentLanguage = "zh"
enableRobotsTXT = true

[outputs]
    home = ["HTML", "RSS", "JSON"]

# 让 static/photos 也能进入 Hugo 资源管线，用于生成分享图
[module]
    [[module.mounts]]
        source = "assets"
        target = "assets"
    [[module.mounts]]
        source = "static/photos"
        target = "assets/photos"

[params]
    env = "production"
    ShowReadingTime = true
    ShowShareButtons = true
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    ShowToc = true
    defaultTheme = "auto"
    ShowSearch = true
    ShowComments = true

    description = "whymoonbrid 的个人站点：日常随笔、资源分享与生活记录。"
    keywords = ["whymoonbrid", "个人博客", "Hugo", "随笔", "资源分享"]
    author = "whymoonbrid"
    ShareButtons = ["weibo", "qq", "copy"]

[params.homeInfoParams]
    Title = "Hi there!"
    Content = "日常分享用，总之什么都会抛过来一点"

[params.qqGroup]
    link = "https://qm.qq.com/q/Fswr0T0PKw"
    title = "加入 QQ 群"
    subtitle = "世界上最大众的群聊"


<!-- 2. 核心 JavaScript 逻辑 (时钟 & 打字机) -->
<!-- ========================================== -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    
    // [功能 A] 实时时钟
    function updateClock() {
        var clockEl = document.getElementById('my-clock');
        if (clockEl) {
            clockEl.innerText = new Date().toLocaleString('zh-CN', { hour12: false });
        }
    }
    updateClock();
    setInterval(updateClock, 1000);

    // [功能 C] 首页打字机效果
    if (window.location.pathname === "/" || window.location.pathname === "/index.html") {
        var titleElement = document.querySelector('.home-info h1');
        var contentElement = document.querySelector('.home-info p');
        
        if (titleElement && contentElement) {
            var titleText = titleElement.innerText;
            var contentText = contentElement.innerText;
            
            titleElement.innerText = "";
            contentElement.innerText = "";
            
            var titleIndex = 0;
            var contentIndex = 0;
            
            function typeWriter() {
                if (titleIndex < titleText.length) {
                    titleElement.innerHTML = titleText.substring(0, titleIndex + 1) + '<span class="cursor">_</span>';
                    titleIndex++;
                    setTimeout(typeWriter, 150); 
                } else if (contentIndex < contentText.length) {
                    titleElement.innerHTML = titleText;
                    contentElement.innerHTML = contentText.substring(0, contentIndex + 1) + '<span class="cursor">_</span>';
                    contentIndex++;
                    setTimeout(typeWriter, 50); 
                } else {
                    contentElement.innerHTML = contentText;
                }
            }
            setTimeout(typeWriter, 500);
        }
    }
});
</script>

<!-- 3. 阅读进度条容器 -->
<!-- ========================================== -->
<div id="reading-progress"></div>
<script>
    window.addEventListener('scroll', function() {
        var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        if (height > 0) {
            var scrolled = (winScroll / height) * 100;
            var progressBar = document.getElementById("reading-progress");
            if (progressBar) {
                progressBar.style.width = scrolled + "%";
            }
        }
    });
</script>

<!-- 5. 评论区（Giscus） -->
<!-- ========================================== -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const giscusRepo = "{{ site.Params.giscus.repo }}";
    const giscusRepoId = "{{ site.Params.giscus.repoId }}";
    const giscusCategory = "{{ site.Params.giscus.category }}";
    const giscusCategoryId = "{{ site.Params.giscus.categoryId }}";

    function isDarkMode() {
        return document.documentElement.classList.contains('dark') || document.documentElement.getAttribute('data-theme') === 'dark';
    }

    function getContainer() {
        if (window.location.pathname.includes('/posts/')) {
            var footer = document.querySelector('footer');
            if (!footer) return null;
            var el = document.getElementById('my-custom-giscus');
            if (!el) {
                el = document.createElement('div');
                el.id = 'my-custom-giscus';
                el.style.cssText = "margin: 40px auto !important; width: 100% !important; max-width: 700px !important; padding: 20px; backdrop-filter: blur(10px); border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); transition: background-color 0.3s;";
                footer.parentNode.insertBefore(el, footer);
            }
            return el;
        }
        if (window.location.pathname.includes('/guestbook/')) {
            return document.getElementById('guestbook-giscus');
        }
        return null;
    }

    function sendThemeToGiscus(iframe) {
        if (!iframe || !iframe.contentWindow) return;
        const theme = isDarkMode() ? "dark_dimmed" : "light";
        iframe.contentWindow.postMessage({ giscus: { setConfig: { theme: theme } } }, 'https://giscus.app');
    }

    function injectGiscus(container) {
        if (container.dataset.comments === 'giscus') return;
        container.dataset.comments = 'giscus';
        container.style.backgroundColor = isDarkMode() ? "rgba(30, 30, 30, 0.7)" : "rgba(255, 255, 255, 0.7)";
        var script = document.createElement('script');
        script.src = "https://giscus.app/client.js";
        script.setAttribute("data-repo", giscusRepo);
        script.setAttribute("data-repo-id", giscusRepoId);
        script.setAttribute("data-category", giscusCategory);
        script.setAttribute("data-category-id", giscusCategoryId);
        script.setAttribute("data-mapping", "pathname");
        script.setAttribute("data-strict", "0");
        script.setAttribute("data-reactions-enabled", "1");
        script.setAttribute("data-emit-metadata", "0");
        script.setAttribute("data-input-position", "bottom");
        script.setAttribute("data-theme", isDarkMode() ? "dark_dimmed" : "light");
        script.setAttribute("data-lang", "zh-CN");
        script.setAttribute("crossorigin", "anonymous");
        script.async = true;
        container.appendChild(script);
    }

    var container = getContainer();
    if (!container) return;

    injectGiscus(container);

    const observer = new MutationObserver(() => {
        container.style.backgroundColor = isDarkMode() ? "rgba(30, 30, 30, 0.7)" : "rgba(255, 255, 255, 0.7)";
        document.querySelectorAll('iframe.giscus-frame').forEach(sendThemeToGiscus);
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'data-theme'] });

    window.addEventListener('message', function (event) {
        if (event.origin !== "https://giscus.app") return;
        if (typeof event.data === 'object' && event.data.giscus) {
            if ('resizeHeight' in event.data.giscus || 'discussion' in event.data.giscus) {
                document.querySelectorAll('iframe.giscus-frame').forEach(sendThemeToGiscus);
            }
        }
    });
});
</script>

<!-- 6. 悬浮背景音乐播放器 -->
<!-- ========================================== -->
<link rel="stylesheet" href="/vendor/aplayer/APlayer.min.css">
<script src="/vendor/aplayer/APlayer.min.js"></script>

<div id="my-aplayer-box" style="position: fixed; bottom: 80px; right: 20px; z-index: 999999; width: 300px; max-width: calc(100vw - 40px);">
    <div id="aplayer"></div>
</div>
<button id="resume-music" type="button" hidden>▶ 继续播放</button>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 继续播放按钮的位置与样式在 custom.css 中定义
    var STORAGE_KEY = 'my-aplayer-state';
    var saved = {};
    try {
        saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {};
    } catch (e) {
        saved = {};
    }

    const ap = new APlayer({
        container: document.getElementById('aplayer'),
        autoplay: false,
        theme: '#00adb5', 
        loop: 'all',
        order: 'list', 
        volume: 0.5,
        audio: [
            { name: '江河日上', artist: 'Fayzz', url: '/music/Fayzz - 江河日上.mp3' },
            { name: 'When It Rains', artist: 'KIAH', url: '/music/KIAH - When It Rains.mp3' },
            { name: 'Shades', artist: '顾忠山', url: '/music/顾忠山 - Shades.mp3' },
            { name: 'Welcome To Va-11 Hall-A', artist: 'Garoad', url: '/music/Garoad - Welcome To Va-11 Hall-A.mp3' }
        ]
    });

    var chip = document.getElementById('resume-music');

    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                index: ap.list.index,
                time: ap.audio.currentTime || 0,
                volume: ap.audio.volume,
                playing: !ap.audio.paused && !ap.audio.ended
            }));
        } catch (e) {}
    }

    if (Number.isInteger(saved.index) && ap.list.audios[saved.index]) {
        ap.list.switch(saved.index);
    }
    if (typeof saved.volume === 'number') {
        ap.volume(saved.volume, true);
    }
    if (typeof saved.time === 'number' && saved.time > 1) {
        var resumeTime = saved.time;
        var applySeek = function() {
            try { ap.audio.currentTime = resumeTime; } catch (e) {}
        };
        if (ap.audio.readyState >= 1) {
            applySeek();
        } else {
            ap.audio.addEventListener('loadedmetadata', applySeek, { once: true });
        }
    }

    // 浏览器通常会拦截无用户手势的自动播放，失败时提供手动续播入口
    if (saved.playing && !window.matchMedia('(max-width: 768px)').matches) {
        ap.play();
        setTimeout(function() {
            if (ap.audio.paused && chip) chip.hidden = false;
        }, 800);
    }

    ap.on('play', function() {
        if (chip) chip.hidden = true;
        saveState();
    });
    ap.on('pause', saveState);
    ap.on('ended', saveState);

    if (chip) {
        chip.addEventListener('click', function() {
            ap.play();
        });
    }

    setInterval(function() {
        if (!ap.audio.paused) saveState();
    }, 2000);
    window.addEventListener('pagehide', saveState);
});
</script>

<!-- 7. 搜索页快捷键 -->
<!-- ========================================== -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    var input = document.getElementById('searchInput');
    if (!input) return;

    document.addEventListener('keydown', function(e) {
        var t = e.target;
        var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
        if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) {
            e.preventDefault();
            if (!input.disabled) {
                input.focus();
                input.select();
            }
        }
    });

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            input.value = '';
            input.dispatchEvent(new Event('input'));
            input.blur();
        }
    });
});
</script>

baseURL = "https://whymoonbrid.github.io/"
locale = "zh-cn"
title = "my life"
theme = "PaperMod"

[outputs]
    home = ["HTML", "RSS", "JSON"]

[params]
    env = "production"
    ShowReadingTime = true
    ShowShareButtons = true
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    ShowToc = true
    defaultTheme = "auto"
    ShowSearch = true
    ShowComments = true

[params.homeInfoParams]
    Title = "Hi there!"
    Content = "日常分享用，总之什么都会抛过来一点"

# ========================================== #
# 导航菜单 (已去重，按权重排序)
# ========================================== #
[[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 5

[[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/posts/"
    weight = 10

[[menu.main]]
    identifier = "guestbook"
    name = "留言板"
    url = "/guestbook/"
    weight = 15

[[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 20

[[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 30

[[menu.main]]
    identifier = "resources"
    name = "资源"
    url = "/resources/"
    weight = 40

[[menu.main]]
    identifier = "search"
    name = "🔍 搜索"
    url = "/search/"
    weight = 50

# ========================================== #
# Giscus 评论配置
# ========================================== #
[params.giscus]
    repo = "whymoonbrid/whymoonbrid.github.io"
    repoId = "R_kgDOVTyFwQ"
    category = "General"                          # ⚠️ 注意：统一改为了 General
    categoryId = "DIC_kwDOVTyFwC4DJW4H"           # ⚠️ 注意：统一为了 ...4H
    mapping = "pathname"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "preferred_color_scheme"
    lang = "zh-CN"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
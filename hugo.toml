baseURL = "https://whymoonbrid.github.io/"
locale = "zh-cn"
title = "我的个人博客"
theme = "PaperMod"

[outputs]
    home = ["HTML", "RSS", "JSON"]

[params]
    env = "production"
    ShowReadingTime = true
    ShowShareButtons = true
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    ShowToc = true
    defaultTheme = "auto"
    ShowSearch = true
    ShowComments = true

[params.homeInfoParams]
    Title = "Hi there!"
    Content = "日常分享用，总之什么都会抛过来一点"

[[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/posts/"
    weight = 10

[[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 20

[[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 30

[params.giscus]
    repo = "whymoonbrid/whymoonbrid.github.io"
    repoId = "R_kgDOVTyFwQ"
    category = "Announcements"
    categoryId = "DIC_kwDOVTyFwC4DJW4G"
    mapping = "pathname"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "preferred_color_scheme"
    lang = "zh-CN"


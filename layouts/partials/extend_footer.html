<!-- 2. 核心 JavaScript 逻辑 (时钟 & 打字机) -->
<!-- ========================================== -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    
    // [功能 A] 实时时钟
    function updateClock() {
        var clockEl = document.getElementById('my-clock');
        if (clockEl) {
            clockEl.innerText = new Date().toLocaleString('zh-CN', { hour12: false });
        }
    }
    updateClock();
    setInterval(updateClock, 1000);

    // [功能 C] 首页打字机效果
    if (window.location.pathname === "/" || window.location.pathname === "/index.html") {
        var titleElement = document.querySelector('.home-info h1');
        var contentElement = document.querySelector('.home-info p');
        
        if (titleElement && contentElement) {
            var titleText = titleElement.innerText;
            var contentText = contentElement.innerText;
            
            titleElement.innerText = "";
            contentElement.innerText = "";
            
            var titleIndex = 0;
            var contentIndex = 0;
            
            function typeWriter() {
                if (titleIndex < titleText.length) {
                    titleElement.innerHTML = titleText.substring(0, titleIndex + 1) + '<span class="cursor">_</span>';
                    titleIndex++;
                    setTimeout(typeWriter, 150); 
                } else if (contentIndex < contentText.length) {
                    titleElement.innerHTML = titleText;
                    contentElement.innerHTML = contentText.substring(0, contentIndex + 1) + '<span class="cursor">_</span>';
                    contentIndex++;
                    setTimeout(typeWriter, 50); 
                } else {
                    contentElement.innerHTML = contentText;
                }
            }
            setTimeout(typeWriter, 500);
        }
    }
});
</script>

<!-- ========================================== -->
<!-- 3. 阅读进度条容器 -->
<!-- ========================================== -->
<div id="reading-progress"></div>
<script>
    window.addEventListener('scroll', function() {
        var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        if (height > 0) {
            var scrolled = (winScroll / height) * 100;
            var progressBar = document.getElementById("reading-progress");
            if (progressBar) {
                progressBar.style.width = scrolled + "%";
            }
        }
    });
</script>

<!-- ========================================== -->
<!-- 5. Giscus 评论区 -->
<!-- ========================================== -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const giscusRepo = "whymoonbrid/whymoonbrid.github.io";
    const giscusRepoId = "R_kgDOVTyFwQ";
    const giscusCategory = "General";
    const giscusCategoryId = "DIC_kwDOVTyFwC4DJW4H";

    function isDarkMode() {
        return document.documentElement.classList.contains('dark') || document.documentElement.getAttribute('data-theme') === 'dark';
    }

    function sendThemeToGiscus(iframe) {
        if (!iframe || !iframe.contentWindow) return;
        const theme = isDarkMode() ? "dark_dimmed" : "light";
        iframe.contentWindow.postMessage({ giscus: { setConfig: { theme: theme } } }, 'https://giscus.app');
    }

    function injectGiscus() {
        let container = null;
        if (window.location.pathname.includes('/posts/')) {
            var footer = document.querySelector('footer');
            if (footer && !document.getElementById('my-custom-giscus')) {
                container = document.createElement('div');
                container.id = 'my-custom-giscus';
                container.style.cssText = "margin: 40px auto !important; width: 100% !important; max-width: 700px !important; padding: 20px; backdrop-filter: blur(10px); border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); transition: background-color 0.3s;";
                footer.parentNode.insertBefore(container, footer);
            } else {
                container = document.getElementById('my-custom-giscus');
            }
        } else if (window.location.pathname.includes('/guestbook/')) {
            container = document.getElementById('guestbook-giscus');
        }

        if (!container) return;

        if (!container.hasChildNodes()) {
            container.style.backgroundColor = isDarkMode() ? "rgba(30, 30, 30, 0.7)" : "rgba(255, 255, 255, 0.7)";
            var script = document.createElement('script');
            script.src = "https://giscus.app/client.js";
            script.setAttribute("data-repo", giscusRepo);
            script.setAttribute("data-repo-id", giscusRepoId);
            script.setAttribute("data-category", giscusCategory);
            script.setAttribute("data-category-id", giscusCategoryId);
            script.setAttribute("data-mapping", "pathname");
            script.setAttribute("data-strict", "0");
            script.setAttribute("data-reactions-enabled", "1");
            script.setAttribute("data-emit-metadata", "0");
            script.setAttribute("data-input-position", "bottom");
            script.setAttribute("data-theme", isDarkMode() ? "dark_dimmed" : "light");
            script.setAttribute("data-lang", "zh-CN");
            script.setAttribute("crossorigin", "anonymous");
            script.async = true;
            container.appendChild(script);
        }
    }

    const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
            if (mutation.attributeName === 'class' || mutation.attributeName === 'data-theme') {
                var giscusDiv = document.getElementById('my-custom-giscus') || document.getElementById('guestbook-giscus');
                if (giscusDiv) {
                    giscusDiv.style.backgroundColor = isDarkMode() ? "rgba(30, 30, 30, 0.7)" : "rgba(255, 255, 255, 0.7)";
                }
                document.querySelectorAll('iframe.giscus-frame').forEach(sendThemeToGiscus);
            }
        });
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'data-theme'] });

    window.addEventListener('message', function (event) {
        if (event.origin !== "https://giscus.app") return;
        if (typeof event.data === 'object' && event.data.giscus) {
            if ('resizeHeight' in event.data.giscus || 'discussion' in event.data.giscus) {
                document.querySelectorAll('iframe.giscus-frame').forEach(sendThemeToGiscus);
            }
        }
    });

    injectGiscus();
});
</script>

<!-- 2. 核心 JavaScript 逻辑 -->
<!-- ========================================== -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    
    // [功能 A] 实时时钟
    function updateClock() {
        var clockEl = document.getElementById('my-clock');
        if (clockEl) {
            clockEl.innerText = new Date().toLocaleString('zh-CN', { hour12: false });
        }
    }
    updateClock();
    setInterval(updateClock, 1000);

    // [功能 B] 强行注入 Giscus 评论区 (仅文章页)
    setTimeout(function() {
        try {
            var footer = document.querySelector('footer');
            if (window.location.pathname.includes('/posts/') && footer && !document.getElementById('my-custom-giscus')) {
                var giscusDiv = document.createElement('div');
                giscusDiv.id = 'my-custom-giscus';
                giscusDiv.style.cssText = "margin: 40px auto !important; width: 100% !important; max-width: 700px !important; padding: 20px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.1);";
                
                footer.parentNode.insertBefore(giscusDiv, footer);

                var script = document.createElement('script');
                script.src = "https://giscus.app/client.js";
                script.setAttribute("data-repo", "whymoonbrid/whymoonbrid.github.io");
                script.setAttribute("data-repo-id", "R_kgDOVTyFwQ");
                script.setAttribute("data-category", "General");
                script.setAttribute("data-category-id", "DIC_kwDOVTyFwC4DJW4H");
                script.setAttribute("data-mapping", "pathname");
                script.setAttribute("data-strict", "0");
                script.setAttribute("data-reactions-enabled", "1");
                script.setAttribute("data-emit-metadata", "0");
                script.setAttribute("data-input-position", "bottom");
                // 👇 修改 1：根据当前博客主题决定初始化颜色
                script.setAttribute("data-theme", document.documentElement.classList.contains('dark') ? "dark_dimmed" : "light");
                script.setAttribute("data-lang", "zh-CN");
                script.setAttribute("crossorigin", "anonymous");
                script.async = true;
                
                giscusDiv.appendChild(script);
            }
        } catch (e) { console.log("评论区加载失败"); }
    }, 1000);

    // [功能 C] 首页打字机效果
    if (window.location.pathname === "/" || window.location.pathname === "/index.html") {
        var titleElement = document.querySelector('.home-info h1');
        var contentElement = document.querySelector('.home-info p');
        
        if (titleElement && contentElement) {
            var titleText = titleElement.innerText;
            var contentText = contentElement.innerText;
            
            titleElement.innerText = "";
            contentElement.innerText = "";
            
            var titleIndex = 0;
            var contentIndex = 0;
            
            function typeWriter() {
                if (titleIndex < titleText.length) {
                    titleElement.innerHTML = titleText.substring(0, titleIndex + 1) + '<span class="cursor">_</span>';
                    titleIndex++;
                    setTimeout(typeWriter, 150); 
                } else if (contentIndex < contentText.length) {
                    titleElement.innerHTML = titleText; // 标题打完清除光标
                    contentElement.innerHTML = contentText.substring(0, contentIndex + 1) + '<span class="cursor">_</span>';
                    contentIndex++;
                    setTimeout(typeWriter, 50); 
                } else {
                    contentElement.innerHTML = contentText; // 全部打完清除光标
                }
            }
            setTimeout(typeWriter, 500);
        }
    }
});
</script>

<!-- ========================================== -->
<!-- 3. 阅读进度条容器 -->
<!-- ========================================== -->
<div id="reading-progress"></div>
<script>
    window.addEventListener('scroll', function() {
        var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        if (height > 0) {
            var scrolled = (winScroll / height) * 100;
            var progressBar = document.getElementById("reading-progress");
            if (progressBar) {
                progressBar.style.width = scrolled + "%";
            }
        }
    });
</script>

<!-- 6. 👇 新增：监听主题切换，实时同步 Giscus 颜色 -->
<!-- ========================================== -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    // 定义一个函数，用来向 iframe 发送修改主题的指令
    function syncGiscusTheme() {
        const isDark = document.documentElement.classList.contains('dark');
        const theme = isDark ? 'dark_dimmed' : 'light';
        
        // 找到页面上的 Giscus iframe
        const iframes = document.querySelectorAll('iframe.giscus-frame');
        iframes.forEach(iframe => {
            iframe.contentWindow.postMessage(
                { giscus: { setConfig: { theme: theme } } },
                'https://giscus.app'
            );
        });
    }

    // 监听 <html> 标签的 class 变化（PaperMod 切换深色模式时会改变这个）
    const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
            if (mutation.attributeName === 'class') {
                syncGiscusTheme();
            }
        });
    });
    
    observer.observe(document.documentElement, { attributes: true });
});
</script>
